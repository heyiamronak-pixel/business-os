kind = "web"
previewPath = "/"
title = "Business OS"
description = "A modular, multi-organization business management and intelligence workspace foundation for teams across industries."
version = "1.0.0"
id = "artifacts/business-os"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23821

[services.development]
run = "pnpm --filter @workspace/business-os run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/business-os", "run", "build" ]
serve = "static"
publicDir = "artifacts/business-os/dist/public/client"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23821"
BASE_PATH = "/"
