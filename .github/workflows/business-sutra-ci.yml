name: Business Sutra CI

on:
  push:
    branches:
      - main
      - foundation/hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: business-sutra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORT: "4173"
      BASE_PATH: "/"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused business logic regression tests
        run: pnpm --filter @workspace/scripts exec tsx --test ./src/business-logic.test.ts

      - name: Run workspace typecheck and production build
        run: pnpm build
