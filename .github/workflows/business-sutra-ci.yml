name: Business Sutra CI

on:
  push:
    branches:
      - main
      - foundation/hardening
      - phase2/identity-data-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: business-sutra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Database tests, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PORT: "4173"
      BASE_PATH: "/"
      DATABASE_URL: "postgresql://business_sutra_runtime:ci-only-test-password@127.0.0.1:5432/business_sutra"
      MIGRATION_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/business_sutra"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: business_sutra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d business_sutra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create least-privilege runtime database role
        run: |
          PGPASSWORD=postgres psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE business_sutra_runtime
            LOGIN PASSWORD 'ci-only-test-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE business_sutra TO business_sutra_runtime;
          GRANT USAGE ON SCHEMA public TO business_sutra_runtime;
          SQL

      - name: Apply database migrations with the migration role
        run: pnpm --filter @workspace/db run migrate

      - name: Grant runtime table permissions
        run: |
          PGPASSWORD=postgres psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT SELECT, INSERT, UPDATE, DELETE ON
            "user", "organization", "member", "invitation", "session", "account", "verification"
            TO business_sutra_runtime;
          GRANT SELECT, INSERT, UPDATE, DELETE ON "branch" TO business_sutra_runtime;
          GRANT SELECT, INSERT ON "audit_log" TO business_sutra_runtime;
          SQL

      - name: Run tenant isolation integration tests against PostgreSQL
        run: pnpm --filter @workspace/scripts exec tsx --test ./src/tenant-isolation.test.ts

      - name: Run focused business logic regression tests
        run: pnpm --filter @workspace/scripts exec tsx --test ./src/business-logic.test.ts

      - name: Run workspace typecheck and production build
        run: pnpm build
